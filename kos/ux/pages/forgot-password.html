<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password — mockup</title>

<!-- God moment check (mockup-guardrails.md): forgot-password is supporting infrastructure, not
     one of the 5 god moments itself — same category as login/signup. Its only job is to get
     someone unstuck and back toward login with as little friction as possible, so it's a single
     field and one clear next action. Backed by Devise's recoverable module (devise-modules.md);
     reset email preview goes through letter_opener in development, per that same note. -->

<!-- Tailwind via CDN, no build step, per mockup-guardrails.md -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Fonts per typography.md ("Signed Sans"): Sora 600 for display, Inter 400 for body.
     IBM Plex Mono (identity-only: handles/timestamps/follow-notices) is intentionally not
     loaded — this screen has no handles or timestamps. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Inter:wght@400&display=swap" rel="stylesheet" />

<style>
  /* Single Thread palette (color-scheme.md) — the one hand-authored CSS the guardrails allow:
     custom properties for tokens, font-family declarations, and the couple of native selectors
     Tailwind has no utility for. */
  :root {
    --primary: #762D64;
    --secondary: #9F568D;
    --accent: #CA21A0;
    --danger: #BE2D39;
    --text: #2B2229;
    --muted: #74636F;
    --surface: #F9F6F8;
    --background: #FAF9FA;
    --border: #E7E0E5;
    --on-fill: #FFFFFF;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #D369B9;
      --secondary: #CA91BC;
      --accent: #E444BC;
      --danger: #D4545E;
      --text: #EDE9EC;
      --muted: #A696A2;
      --surface: #21181E;
      --background: #140F13;
      --border: #574252;
      --on-fill: #140F13; /* dark theme's own background, per color-scheme.md's fill-role rule */
    }
  }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: var(--background);
  }

  .font-display {
    font-family: 'Sora', sans-serif;
  }

  /* Focus rule (tech-stack.md): every interactive element gets a visible 2px accent outline,
     2px offset. :focus-visible has no Tailwind utility, so it's hand-authored here. */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Motion (tech-stack.md): component-only 150ms ease transitions, dropped for reduced motion. */
  input,
  button {
    transition: border-color 150ms ease, background-color 150ms ease;
  }

  @media (prefers-reduced-motion: reduce) {
    input,
    button {
      transition: none;
    }
  }
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

  <main class="w-full max-w-sm">
    <form
      class="rounded-2xl p-8"
      style="background: var(--surface); border: 1px solid var(--border);"
      novalidate
    >
      <h1 class="font-display text-2xl font-semibold mb-1">Forgot your password?</h1>
      <p class="text-sm mb-6" style="color: var(--muted);">
        Enter your email and we'll send you a link to reset it.
      </p>

      <div class="flex flex-col gap-5">
        <!-- Email -->
        <div class="flex flex-col gap-1.5">
          <label for="email" class="text-sm font-medium">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            class="rounded-lg px-3 py-2 text-base bg-transparent"
            style="border: 1px solid var(--border); color: var(--text);"
          />
          <!-- Error state example (danger text, same plain-text pattern as login/signup) — shown
               here for reference; a real screen only renders this after a failed submit. -->
          <span class="text-xs hidden" style="color: var(--danger);">We couldn't find an account with that email.</span>
        </div>

        <button
          type="submit"
          class="font-display text-sm font-semibold rounded-lg py-2.5 mt-2"
          style="background: var(--primary); color: var(--on-fill);"
        >
          Send reset instructions
        </button>
      </div>
    </form>

    <p class="text-center text-sm mt-6" style="color: var(--muted);">
      Remembered it after all?
      <a href="#" class="font-medium" style="color: var(--primary);">Log in</a>
    </p>
  </main>

</body>
</html>
