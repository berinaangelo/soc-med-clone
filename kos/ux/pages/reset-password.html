<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — mockup</title>

<!-- God moment check (mockup-guardrails.md): reset-password is supporting infrastructure, not
     one of the 5 god moments itself — same category as login/signup/forgot-password. It's the
     screen the reset-email link lands on (Devise recoverable module, devise-modules.md), previewed
     locally via letter_opener in development rather than actually sent. Job is the same as the
     rest of this auth chain: get someone back into their account with as little friction as
     possible, so it's just the two password fields, no extra chrome. -->

<!-- Tailwind via CDN, no build step, per mockup-guardrails.md -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Fonts per typography.md ("Signed Sans"): Sora 600 for display, Inter 400 for body.
     IBM Plex Mono (identity-only: handles/timestamps/follow-notices) is intentionally not
     loaded — this screen has no handles or timestamps. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Inter:wght@400&display=swap" rel="stylesheet" />

<style>
  /* Single Thread palette (color-scheme.md) — the one hand-authored CSS the guardrails allow:
     custom properties for tokens, font-family declarations, and the couple of native selectors
     Tailwind has no utility for. */
  :root {
    --primary: #762D64;
    --secondary: #9F568D;
    --accent: #CA21A0;
    --danger: #BE2D39;
    --text: #2B2229;
    --muted: #74636F;
    --surface: #F9F6F8;
    --background: #FAF9FA;
    --border: #E7E0E5;
    --on-fill: #FFFFFF;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #D369B9;
      --secondary: #CA91BC;
      --accent: #E444BC;
      --danger: #D4545E;
      --text: #EDE9EC;
      --muted: #A696A2;
      --surface: #21181E;
      --background: #140F13;
      --border: #574252;
      --on-fill: #140F13; /* dark theme's own background, per color-scheme.md's fill-role rule */
    }
  }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: var(--background);
  }

  .font-display {
    font-family: 'Sora', sans-serif;
  }

  /* Focus rule (tech-stack.md): every interactive element gets a visible 2px accent outline,
     2px offset. :focus-visible has no Tailwind utility, so it's hand-authored here. */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Motion (tech-stack.md): component-only 150ms ease transitions, dropped for reduced motion. */
  input,
  button {
    transition: border-color 150ms ease, background-color 150ms ease;
  }

  @media (prefers-reduced-motion: reduce) {
    input,
    button {
      transition: none;
    }
  }
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

  <main class="w-full max-w-sm">
    <form
      class="rounded-2xl p-8"
      style="background: var(--surface); border: 1px solid var(--border);"
      novalidate
    >
      <h1 class="font-display text-2xl font-semibold mb-1">Reset your password</h1>
      <p class="text-sm mb-6" style="color: var(--muted);">
        Choose a new password for your account.
      </p>

      <!-- Devise's edit_password form carries the reset_password_token as a hidden field, not a
           visible one — kept here for shape even though it renders nothing. -->
      <input type="hidden" name="reset_password_token" value="" />

      <div class="flex flex-col gap-5">
        <!-- New password -->
        <div class="flex flex-col gap-1.5">
          <label for="password" class="text-sm font-medium">New password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
            class="rounded-lg px-3 py-2 text-base bg-transparent"
            style="border: 1px solid var(--border); color: var(--text);"
          />
          <!-- Neutral hint per iconography.md's form-hint rule: plain text below the field,
               --muted, no icon/border-color change/toast. -->
          <span class="text-xs" style="color: var(--muted);">At least 6 characters.</span>
        </div>

        <!-- Confirm new password -->
        <div class="flex flex-col gap-1.5">
          <label for="password_confirmation" class="text-sm font-medium">Confirm new password</label>
          <input
            id="password_confirmation"
            name="password_confirmation"
            type="password"
            autocomplete="new-password"
            required
            class="rounded-lg px-3 py-2 text-base bg-transparent"
            style="border: 1px solid var(--border); color: var(--text);"
          />
          <!-- Error state example (danger text, same plain-text pattern as the rest of this auth
               chain) — shown here for reference; a real screen only renders this after a failed
               submit. -->
          <span class="text-xs hidden" style="color: var(--danger);">Passwords don't match.</span>
        </div>

        <button
          type="submit"
          class="font-display text-sm font-semibold rounded-lg py-2.5 mt-2"
          style="background: var(--primary); color: var(--on-fill);"
        >
          Reset password
        </button>
      </div>
    </form>
  </main>

</body>
</html>
