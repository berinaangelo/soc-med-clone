<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Persistent nav — component mockup</title>

<!-- God moment check (mockup-guardrails.md): this isn't a screen with one god moment of its own —
     it's supporting infrastructure, per the guardrails' explicit allowance for that answer. It's
     the chrome that makes #1 ("Someone Noticed Me") visible from anywhere via the bell, and gets
     the viewer to #2/#5 (Directory, Feed) from anywhere too.

     What this file exists to pin down, since it was two loose ends across the four page mockups
     rather than one settled thing:

     1. The bell's unread state. iconography.md names "unread bell" as one of Signal Weight's
        chip-triggering states, same weight as a current-tab icon — and notifications-ui.md is
        explicit that the corner dot sits "on top of that [chip], not a replacement for it." The
        bell built into feed.html/directory.html/profile.html only ever shipped the dot, no chip —
        an incomplete read of the decision, fixed here and back-ported into those three files (the
        dot-only version undersold the "someone noticed you" signal the chip is there to carry).
        notifications.html was already correct: current-tab chip, no dot, since by the time that
        page renders, mark-all-as-read has already fired.

     2. The root path. public-vs-authenticated-pages.md: logged-out visitors land on the
        Directory, logged-in visitors land on Feed — a routing fact, not a distinct visual
        element. No wordmark/home icon exists anywhere in the KOS (feed.html's build comment says
        so explicitly), so this file doesn't invent one; it demonstrates the fact by session state
        alone — flip to "Logged out" and the whole rail (Feed/Directory/Notifications/avatar)
        disappears in favor of the two-link header already established in directory.html, with
        Directory as the only page still reachable; flip to "Logged in" and Feed is what a bare
        "/" resolves to. The caption under each toggle just states which. -->

<!-- Tailwind via CDN, no build step, per mockup-guardrails.md -->
<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Inter:wght@400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />

<style>
  /* Single Thread palette (color-scheme.md) — identical tokens to every other mockup. */
  :root {
    --primary: #762D64;
    --secondary: #9F568D;
    --accent: #CA21A0;
    --danger: #BE2D39;
    --text: #2B2229;
    --muted: #74636F;
    --surface: #F9F6F8;
    --background: #FAF9FA;
    --border: #E7E0E5;
    --on-fill: #FFFFFF;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #D369B9;
      --secondary: #CA91BC;
      --accent: #E444BC;
      --danger: #D4545E;
      --text: #EDE9EC;
      --muted: #A696A2;
      --surface: #21181E;
      --background: #140F13;
      --border: #574252;
      --on-fill: #140F13;
    }
  }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: var(--background);
  }

  .font-display { font-family: 'Sora', sans-serif; }
  .font-mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  a,
  button {
    transition: border-color 150ms ease, background-color 150ms ease, color 150ms ease;
  }

  @media (prefers-reduced-motion: reduce) {
    a, button { transition: none; }
  }
</style>
</head>

<body class="min-h-screen">

  <main class="max-w-3xl mx-auto px-6 py-10 flex flex-col gap-8">
    <div>
      <h1 class="font-display text-2xl font-semibold mb-1">Persistent nav</h1>
      <p class="text-sm" style="color: var(--muted);">Shared chrome, not a route — reused as-is across every page mockup.</p>
    </div>

    <!-- Controls — both toggles are mockup-only, same pattern as the page mockups' state
         switchers, just two of them here since this component has two independent variables. -->
    <div class="flex flex-wrap items-center gap-3">
      <button
        type="button"
        id="session-toggle"
        onclick="setSession(document.getElementById('rail-panel').dataset.session !== 'in');"
        class="text-xs font-medium rounded-lg px-3 py-1.5"
        style="border: 1px solid var(--border); color: var(--muted);"
      >
        Session: logged in — click to log out
      </button>
      <button
        type="button"
        id="unread-toggle"
        onclick="setUnread(document.getElementById('bell').dataset.unread !== 'true');"
        class="text-xs font-medium rounded-lg px-3 py-1.5"
        style="border: 1px solid var(--border); color: var(--muted);"
      >
        Bell: unread — click to mark read
      </button>
    </div>

    <!-- Panel frame — a fixed-height box standing in for "the rest of the page," just so the
         sticky rail / header has somewhere to sit, same border/surface language as every card
         elsewhere in the mockups. -->
    <div id="rail-panel" data-session="in" class="rounded-2xl overflow-hidden" style="border: 1px solid var(--border); background: var(--surface);">

      <!-- Logged-in: the rail, byte-for-byte the same markup as feed.html/directory.html/
           profile.html/notifications.html. -->
      <div id="rail-logged-in" class="flex">
        <aside
          class="w-20 shrink-0 flex flex-col items-center py-6 gap-2"
          style="border-right: 1px solid var(--border); background: var(--background);"
        >
          <nav class="flex flex-col items-center gap-2" aria-label="Primary">
            <a href="../pages/feed.html" title="Feed" class="flex items-center justify-center p-1.5 rounded-full hover:bg-[var(--surface)]">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5" style="color: var(--text);">
                <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
              </svg>
            </a>

            <a href="../pages/directory.html" title="Directory" class="flex items-center justify-center p-1.5 rounded-full hover:bg-[var(--surface)]">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5" style="color: var(--text);">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
            </a>

            <!-- Bell — the two states this file exists to pin down. Unread: solid primary chip
                 (same weight/sizing as a current-tab icon, w-4 h-4 on-fill glyph inside a p-1.5
                 chip) with the accent corner dot layered on top. Read: plain outline, no chip,
                 no dot — identical to the Feed/Directory icons beside it. -->
            <a href="../pages/notifications.html" title="Notifications" id="bell" data-unread="true" class="relative flex items-center justify-center p-1.5 rounded-full">
              <svg id="bell-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
              </svg>
              <span id="bell-dot" class="absolute top-1 right-1 w-2 h-2 rounded-full" style="background: var(--accent); border: 2px solid var(--background);"></span>
            </a>

            <!-- Friend requests — new (friend-requests-preview.md), back-ported here and into
                 every page mockup carrying this rail, same convention Messages used. Person +
                 checkmark, not Directory's two-person glyph, to stay unambiguous one slot away
                 from it. No unread badge, same no-badge precedent Messages already set. -->
            <a href="../pages/friend-requests.html" title="Friend requests" class="flex items-center justify-center p-1.5 rounded-full hover:bg-[var(--surface)]">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5" style="color: var(--text);">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M15 11.5l2 2 4-4.5" />
              </svg>
            </a>

            <!-- Messages — new (direct-messages-preview.md), back-ported here and into every page
                 mockup carrying this rail. Last in the rail, above the avatar: the one nav item
                 with no god-moment tie, kept after the three that do have one. Lucide "mail," not
                 message-circle (already spoken for by Comments). -->
            <a href="../pages/messages.html" title="Messages" class="flex items-center justify-center p-1.5 rounded-full hover:bg-[var(--surface)]">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5" style="color: var(--text);">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
              </svg>
            </a>
          </nav>

          <a href="../pages/profile.html" title="Your profile" class="mt-auto mb-2 shrink-0 rounded-full">
            <span class="w-8 h-8 rounded-full flex items-center justify-center font-display text-xs font-semibold" style="background: var(--secondary); color: var(--on-fill);">
              YK
            </span>
          </a>
        </aside>

        <div class="flex-1 min-w-0 flex items-center justify-between px-6 py-6">
          <p class="text-sm" style="color: var(--muted);">Rest of the page goes here.</p>
          <p class="text-xs font-mono" style="color: var(--muted);">Root path (/) → <span style="color: var(--text);">Feed</span></p>
        </div>
      </div>

      <!-- Logged-out: no rail at all, just the two-link header already established in
           directory.html's header-logged-out. Directory is the only nav destination left —
           Feed/Notifications/Profile all require a session (public-vs-authenticated-pages.md). -->
      <div id="rail-logged-out" class="hidden flex-col">
        <header class="flex items-center justify-between gap-4 px-6 py-4" style="border-bottom: 1px solid var(--border);">
          <a href="../pages/directory.html" class="font-display text-sm font-semibold">Directory</a>
          <div class="flex items-center gap-4">
            <a href="../pages/login.html" class="text-sm font-medium" style="color: var(--primary);">Log in</a>
            <a href="../pages/signup.html" class="font-display text-sm font-semibold rounded-lg px-4 py-2" style="background: var(--primary); color: var(--on-fill);">
              Sign up
            </a>
          </div>
        </header>
        <div class="flex items-center justify-between px-6 py-6">
          <p class="text-sm" style="color: var(--muted);">Rest of the page goes here.</p>
          <p class="text-xs font-mono" style="color: var(--muted);">Root path (/) → <span style="color: var(--text);">Directory</span></p>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Mockup-only state logic — not app UI, same spirit as every page mockup's preview toggle.
    function setSession(loggedIn) {
      const panel = document.getElementById('rail-panel');
      panel.dataset.session = loggedIn ? 'in' : 'out';
      document.getElementById('rail-logged-in').classList.toggle('hidden', !loggedIn);
      document.getElementById('rail-logged-in').classList.toggle('flex', loggedIn);
      document.getElementById('rail-logged-out').classList.toggle('hidden', loggedIn);
      document.getElementById('rail-logged-out').classList.toggle('flex', !loggedIn);
      document.getElementById('session-toggle').textContent = loggedIn
        ? 'Session: logged in — click to log out'
        : 'Session: logged out — click to log in';
    }

    function setUnread(unread) {
      const bell = document.getElementById('bell');
      bell.dataset.unread = unread;
      bell.style.background = unread ? 'var(--primary)' : '';
      document.getElementById('bell-icon').style.color = unread ? 'var(--on-fill)' : 'var(--text)';
      document.getElementById('bell-dot').classList.toggle('hidden', !unread);
      document.getElementById('unread-toggle').textContent = unread
        ? 'Bell: unread — click to mark read'
        : 'Bell: read — click to mark unread';
    }

    // Initial paint matches the data- attributes already on the markup above.
    setUnread(true);
  </script>

</body>
</html>
